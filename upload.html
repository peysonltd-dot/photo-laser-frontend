<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>上傳照片｜AI 人像雷雕體驗</title><link rel="stylesheet" href="style.css?v=20261104-horizontal5"><script src="config.js?v=20261104-home4"></script><script defer src="photo-input.js?v=20261104-flow3"></script><script defer src="upload.js?v=20261104-flow3"></script></head><body><main><header><div class="event"><div class="event-brand"><img class="event-brand-logo" src="assets/innoserve/brand-logo.svg" alt="InnoServe Awards"><div class="event-brand-title"><img src="assets/innoserve/brand-title-black.jpg" alt="大專校院資訊應用服務創新競賽 — International ICT Innovative Services Awards"></div></div></div><h1>上傳手機照片</h1></header><section class="card"><p>請選擇正面、臉部清晰的單人照片，避免多人合照。</p><form id="photo-form"><label class="file-label">選擇手機照片<input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp" required></label><p>支援 JPG、PNG、WebP，最大 20 MB。</p><img id="photo-preview" class="portrait" alt="照片預覽" hidden><div class="actions"><button id="send" class="primary" disabled>確認照片並送出</button></div></form><p id="upload-status" role="status">送出後請回到大螢幕繼續操作。</p></section></main></body></html>
