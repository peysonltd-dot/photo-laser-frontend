<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雷雕系統設定</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script defer src="settings.js"></script></head><body><main><header><h1>雷雕系統設定</h1></header><nav class="admin-tabs"><a href="admin.html">訂單管理</a><a class="active" href="settings.html">設定</a></nav><form id="login" class="card"><label>管理密碼 <input id="key" type="password" required></label><button>登入</button></form><section id="settings" hidden><div class="toolbar"><button id="refresh">重新載入</button><button id="logout">登出</button></div><p id="status" role="status"></p><section class="card settings-card"><h2>白名單代碼</h2><p>每碼限完成一筆訂單。已開始使用的代碼可刪除停用，但不能改名。刪除不會刪除歷史訂單或退回庫存。</p><form id="code-form"><input id="code-id" type="hidden"><label>代碼 <input id="code" maxlength="64" required autocomplete="off"></label><button>儲存代碼</button><button type="button" id="code-reset">清空編輯</button></form><div id="codes"></div></section><section class="card settings-card"><h2>杯款顏色與庫存</h2><p>庫存填「目前可供選擇的剩餘數量」。確認送單才扣庫存；下架後前台不再顯示。取消製作不會自動退庫存，請核對後手動調整。</p><form id="color-form"><input id="color-id" type="hidden"><label>顏色名稱 <input id="color-name" required maxlength="40"></label><label>顯示色 <input id="swatch" type="color" value="#133139"></label><label>剩餘庫存 <input id="stock" type="number" min="0" max="100000" step="1" required value="0"></label><label><input id="active" type="checkbox" checked> 上架</label><button>儲存顏色</button><button id="color-reset" type="button">新增另一色</button></form><div id="colors"></div></section><section class="card settings-card"><h2>下載設定</h2><label>雷雕圖寬度（mm） <input id="width" type="number" min="20" max="200" value="60"></label><button id="save-width">儲存</button><p>設定儲存在此瀏覽器。PNG 為白底黑線、300 dpi；AI 原始線稿為 1024 像素，放大不會增加原始細節。</p></section></section></main></body></html>
