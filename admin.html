<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雷雕工作台｜PEYSON</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script defer src="admin.js"></script></head><body><main style="max-width:1200px;width:94%"><header><div class="eyebrow">PEYSON · LASER WORKSPACE</div><h1>雷雕工作台</h1><p>單款線稿 · 原始照片保留 · 分批載入</p></header><form id="login" class="card"><label>管理密碼 <input id="key" type="password" autocomplete="current-password" required></label><button class="primary">進入後台</button></form><section id="work" class="hidden"><div class="toolbar"><button id="refresh">重新整理</button><button id="logout">登出</button><label>下載寬度（mm） <input id="width" type="number" min="20" max="200" value="60" style="width:90px"></label></div><p class="note">60 mm 為暫定輸出寬度，請依實際雕刻尺寸調整。輸出為白底黑線 PNG、300 dpi；不是 SVG 單線路徑。1–2 pt 為生成目標，需打樣確認。</p><p id="status" role="status"></p><div id="orders"></div><div class="actions"><button id="more">載入更多（50 筆）</button></div><aside id="downloads" class="card" style="margin-top:24px"><h2>下載檔案</h2><p class="note">慢速網路不設 30 秒自動中斷；可手動取消等待。下載連結在重新整理前有效。</p></aside></section></main></body></html>
